# CRAN metadata allows exactly ONE person to hold the creator/maintainer role
# ("cre"), so DESCRIPTION names Yannek there and Max as an author. That is a
# packaging constraint, not a statement about who made the package - pkgdown
# reads roles straight from DESCRIPTION and they cannot be overridden here, so
# the site states the real situation in prose instead.
#
# NB: non-ASCII must be written as a YAML \u escape. This file is read with
# readLines(), which fails outright on raw UTF-8 under a C locale - so a literal
# "a-umlaut" here breaks the whole site build.
authors:
  before: "FINN is created and developed by **Yannek K\u00E4ber** and **Maximilian Pichler**. R package metadata records only one person as creator/maintainer, so that field names a single point of contact - it does not rank authorship."
  "Yannek K\u00E4ber":
    href: https://orcid.org/0000-0002-7041-9849
  Maximilian Pichler:
    href: https://orcid.org/0000-0003-2252-8327

reference:
- title: Model setup
  desc: Define a FINN model and how each demographic process is represented.
  contents:
  - finn
  - createProcess
  - createHybrid
  - CohortMat

- title: Fitting and prediction
  desc: Calibrate every component jointly, end-to-end, then simulate.
  contents:
  - fit
  - predict.finn_class
  - simulateForest
  - FINN.seed

- title: Processes
  desc: The built-in mechanistic demographic functions and allometries.
  contents:
  - growth
  - mortality
  - regeneration
  - competition
  - height
  - BA_stand
  - BA_stem
  - dbh2ba

- title: Data preparation
  desc: Turn a raw tree list and environment table into FINN's inputs.
  contents:
  - makeObsData
  - resolveSiteIDs
  - makeInitCohorts
  - climateDF2array
  - obsDF2arrays
  - array2obsDF
  - pred2DF
  - extract_env

- title: Environmental scaling
  desc: >
    FINN standardises environmental predictors internally
    (`env_autoscale = TRUE`); these expose the stored constants.
  contents:
  - apply_env_scaling
  - compute_env_scaling

- title: Interpretation (xAI)
  desc: Read back what a fitted - or hybrid - model actually learned.
  contents:
  - ALE
  - plot.FINNale
  - summary.finn_class
  - conditionalEffects
  - averageConditionalEffects
  - feature_importance

- title: Low-level utilities
  desc: Building blocks used internally and exported for advanced use.
  contents:
  - aggregate_results_old
  - binomial_from_bernoulli
  - binomial_from_gamma
  - groupby_mean
  - index_species
  - np_runif
  - rweibull_cohorts
  - sample_poisson_relaxed

